name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          PUBLIC_STRIPE_LINK_MONTHLY: ${{ vars.PUBLIC_STRIPE_LINK_MONTHLY }}
          PUBLIC_STRIPE_LINK_YEARLY: ${{ vars.PUBLIC_STRIPE_LINK_YEARLY }}
          PUBLIC_PAYPAL_LINK_MONTHLY: ${{ vars.PUBLIC_PAYPAL_LINK_MONTHLY }}
          PUBLIC_PAYPAL_LINK_YEARLY: ${{ vars.PUBLIC_PAYPAL_LINK_YEARLY }}
          PUBLIC_TRIAL_FORM_ENDPOINT: ${{ vars.PUBLIC_TRIAL_FORM_ENDPOINT }}
          PUBLIC_NOTIFY_FORM_ENDPOINT: ${{ vars.PUBLIC_NOTIFY_FORM_ENDPOINT }}
          PUBLIC_CLIENT_WINDOWS_URL: ${{ vars.PUBLIC_CLIENT_WINDOWS_URL }}
          PUBLIC_CLIENT_MACOS_URL: ${{ vars.PUBLIC_CLIENT_MACOS_URL }}
          PUBLIC_SALES_EMAIL: ${{ vars.PUBLIC_SALES_EMAIL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
